<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
        />

        <!-- PWA Meta Tags -->
        <!-- Neutral default; overridden at runtime (app.json statusBarColor / theme header). -->
        <meta name="theme-color" content="#FFFFFF" />
        <meta
            name="description"
            content="Explore rich history with immersive guided audio tours"
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- The web app manifest link is added at build time: by vite-plugin-pwa in compiled builds, by manifestModeLink() (vite.config.ts) in manifest mode. Both in the page would link it twice. -->

        <!-- iOS Specific -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="AudioGuideKit" />
        <!-- Apple touch icons - Safari uses these, not the manifest -->
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="152x152"
            href="/icons/icon-152x152.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="144x144"
            href="/icons/icon-144x144.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="120x120"
            href="/icons/icon-120x120.png"
        />

        <title>AudioGuideKit</title>
        <script>
            // Reset viewport zoom immediately on load (iOS Safari persists zoom across reloads)
            (function () {
                var meta = document.querySelector('meta[name=viewport]');
                if (meta) {
                    meta.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover');
                }
            })();

            // Prevent browser pinch-to-zoom. iOS Safari ignores user-scalable=no since iOS 10.
            // Leaflet zooms via its own JS handlers — unaffected by preventDefault() here.
            document.addEventListener('gesturestart', function (e) {
                e.preventDefault();
            }, { passive: false });
            document.addEventListener('gesturechange', function (e) {
                e.preventDefault();
            }, { passive: false });
            document.addEventListener('touchmove', function (e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
        </script>
        <style>
            /* Ensure full viewport height including safe areas */
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                /* Prevent pinch-to-zoom on Chrome/Android at CSS level */
                touch-action: pan-x pan-y;
            }

            /* Initialize viewport height variable immediately */
            :root {
                --vh: 1vh;
            }

            /* Hide scrollbar for Chrome, Safari and Opera */
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }

            /* Hide scrollbar for IE, Edge and Firefox */
            .no-scrollbar {
                -ms-overflow-style: none;
                /* IE and Edge */
                scrollbar-width: none;
                /* Firefox */
            }
        </style>
    </head>

    <body>
        <div id="root">
            <!-- Loading indicator shown while app initializes -->
            <div
                id="loading-screen"
                style="
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    height: 100dvh;
                    font-family: &quot;Inter&quot;, sans-serif;
                    color: #666;
                "
            >
                <div style="text-align: center">
                    <div
                        style="
                            width: 40px;
                            height: 40px;
                            border: 3px solid #f3f3f3;
                            border-top: 3px solid #3498db;
                            border-radius: 50%;
                            animation: spin 1s linear infinite;
                            margin: 0 auto 16px;
                        "
                    ></div>
                    <div id="loading-status">Loading...</div>
                    <div
                        id="debug-info"
                        style="
                            margin-top: 20px;
                            font-size: 12px;
                            color: #999;
                            max-width: 300px;
                        "
                    ></div>
                </div>
            </div>
            <style>
                @keyframes spin {
                    0% {
                        transform: rotate(0deg);
                    }

                    100% {
                        transform: rotate(360deg);
                    }
                }
            </style>
        </div>
        <script>
            // Development mode detection (hostname-based for inline scripts)
            const DEV_MODE =
                window.location.hostname === "localhost" ||
                window.location.hostname.includes("192.168") ||
                window.location.hostname.includes("127.0.0.1") ||
                window.location.search.includes("debug=true");

            // Visual debug helper
            function updateDebugInfo(message) {
                if (!DEV_MODE) return;
                const debugDiv = document.getElementById("debug-info");
                if (debugDiv) {
                    debugDiv.innerHTML += message + "<br>";
                }
            }

            function updateLoadingStatus(message) {
                if (!DEV_MODE) return;
                const statusDiv = document.getElementById("loading-status");
                if (statusDiv) {
                    statusDiv.textContent = message;
                }
            }

            // Register service worker immediately for better offline support on iOS
            if (DEV_MODE) {
                console.log("[APP] Starting SW registration...");
                updateDebugInfo("Starting...");
                updateDebugInfo("Online: " + (navigator.onLine ? "YES" : "NO"));
                console.log(
                    "[APP] Online status:",
                    navigator.onLine ? "ONLINE" : "OFFLINE",
                );
                console.log("[APP] Expected SW version: 1.0.3-NAVIGATION-FIX");
            }

            if (
                "serviceWorker" in navigator &&
                !/localhost/.test(window.location) &&
                // The preview host (the edge injects this tag only there) is an editor's
                // frame, not an installed app: a worker would serve the precached
                // index.html and with it never see the injected tag.
                !document.querySelector('meta[name="agk-preview-origins"]')
            ) {
                navigator.serviceWorker
                    .register("/sw.js", { scope: "/" })
                    .then((registration) => {
                        if (DEV_MODE) {
                            console.log("[APP] ✅ SW registered successfully");
                            console.log("[APP] SW state:", {
                                installing: registration.installing
                                    ? "yes"
                                    : "no",
                                waiting: registration.waiting ? "yes" : "no",
                                active: registration.active ? "yes" : "no",
                                scope: registration.scope,
                                updateViaCache: registration.updateViaCache,
                            });

                            if (registration.active) {
                                console.log(
                                    "[APP] Active SW state:",
                                    registration.active.state,
                                );
                                console.log(
                                    "[APP] Active SW URL:",
                                    registration.active.scriptURL,
                                );
                            }
                        } else {
                            // Minimal production logging
                            console.log("[APP] Service worker registered");
                        }

                        // Force update check
                        registration
                            .update()
                            .then(() => {
                                if (DEV_MODE) {
                                    console.log(
                                        "[APP] ✅ SW update check completed",
                                    );
                                }
                            })
                            .catch((err) => {
                                if (DEV_MODE) {
                                    console.log(
                                        "[APP] SW update check failed:",
                                        err,
                                    );
                                }
                            });

                        // Listen for SW state changes (dev only)
                        if (DEV_MODE) {
                            registration.addEventListener("updatefound", () => {
                                console.log("[APP] SW update found!");
                                const newWorker = registration.installing;
                                if (newWorker) {
                                    newWorker.addEventListener(
                                        "statechange",
                                        () => {
                                            console.log(
                                                "[APP] SW state changed to:",
                                                newWorker.state,
                                            );
                                        },
                                    );
                                }
                            });
                        }
                    })
                    .catch((err) => {
                        // Always log errors
                        console.error("[APP] ❌ SW registration failed:", err);
                    });

                // Log when SW controller changes (dev only)
                if (DEV_MODE) {
                    navigator.serviceWorker.addEventListener(
                        "controllerchange",
                        () => {
                            console.log(
                                "[APP] SW controller changed - new SW is now active",
                            );
                        },
                    );
                }

                // Check current controller (dev only)
                if (DEV_MODE) {
                    if (navigator.serviceWorker.controller) {
                        console.log(
                            "[APP] Page is currently controlled by SW:",
                            navigator.serviceWorker.controller.scriptURL,
                        );
                        updateDebugInfo("✅ SW Active");
                    } else {
                        console.log(
                            "[APP] ⚠️ Page is NOT controlled by any SW yet",
                        );
                        updateDebugInfo("⚠️ No SW");
                    }
                }
            } else {
                if (DEV_MODE) {
                    console.log(
                        "[APP] SW not supported or running on localhost",
                    );
                    updateDebugInfo("❌ SW not supported");
                }
            }

            // Monitor online/offline status (dev only)
            if (DEV_MODE) {
                window.addEventListener("online", () => {
                    console.log("[APP] Network: ONLINE");
                    updateDebugInfo("Network: ONLINE");
                });
                window.addEventListener("offline", () => {
                    console.log("[APP] Network: OFFLINE");
                    updateDebugInfo("Network: OFFLINE");
                });
            }

            // Catch any errors during load
            window.addEventListener("error", (event) => {
                // Always log errors
                console.error("[APP] Error:", event.error);
                if (DEV_MODE) {
                    updateLoadingStatus("Error loading!");
                    updateDebugInfo(
                        "❌ " +
                            (event.error?.message ||
                                event.message ||
                                "Unknown error"),
                    );
                }
            });

            // Update loading status (dev only)
            if (DEV_MODE) {
                setTimeout(() => {
                    updateLoadingStatus("Loading React...");
                }, 1000);
            }

            // Inspect cache contents after page loads (dev only)
            if (DEV_MODE) {
                window.addEventListener("load", async () => {
                    console.log("[APP] 🔍 Inspecting cache contents...");

                    try {
                        const cacheNames = await caches.keys();
                        console.log("[APP] Found caches:", cacheNames);

                        for (const cacheName of cacheNames) {
                            const cache = await caches.open(cacheName);
                            const requests = await cache.keys();
                            console.log(
                                `[APP] Cache "${cacheName}" contains ${requests.length} entries:`,
                            );

                            // Log first 10 URLs from each cache
                            requests.slice(0, 10).forEach((req) => {
                                console.log(`  - ${req.url}`);
                            });

                            if (requests.length > 10) {
                                console.log(
                                    `  ... and ${requests.length - 10} more`,
                                );
                            }
                        }

                        console.log("[APP] 🔍 Cache inspection complete!");
                    } catch (err) {
                        console.error("[APP] Error inspecting caches:", err);
                    }
                });
            }
        </script>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
